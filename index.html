<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luso·Math — ポルトガル語 × 数学 × アフリカ近現代史</title>
    <meta
      name="description"
      content="高校数学（文系）と、モザンビーク・アンゴラの近現代史・ポルトガル語を一緒に学べる、80sシティポップ風ブラウザゲーム。"
    />
    <!-- レトロ／ピクセル系フォント（オフライン時はsystem-uiにフォールバック） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- BGM（80sシティポップ）。ループ再生、初回操作で開始 -->
    <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
    <button
      id="music-toggle"
      class="music-toggle"
      title="BGMのオン／オフ"
      aria-label="BGMのオン／オフ"
    >
      🔈
    </button>

    <main id="app"><!-- ゲーム画面はJSで描画 --></main>

    <!-- データ（キャンペーン）→ エンジンの順で読み込む -->
    <script src="js/data/mozambique.js"></script>
    <script src="js/data/angola.js"></script>
    <script src="js/game.js"></script>
    <script src="js/audio.js"></script>
  </body>
</html>
